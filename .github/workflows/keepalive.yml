# Daily keepalive ping for the Supabase free-tier project.
#
# Why: Supabase pauses a free-tier project after 7 days of no inbound activity.
# This workflow sends one request per day to the app's /api/keepalive route,
# which runs a trivial Supabase query so the project counts as active and is
# not paused. Scheduled (cron) workflows run only on the default branch, so
# this is effective only when committed to `main`.
#
# The app URL is hardcoded below — no repository variable or setup is needed.
# If the production URL changes, update APP_URL here.
#
# You can also run it on demand from the Actions tab ("Run workflow").

name: Supabase keepalive

on:
  schedule:
    # 08:17 UTC daily. Off the :00 mark to spread load; adjust freely.
    - cron: "17 8 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      APP_URL: https://admin.freedomfamilyelectric.com
    steps:
      - name: Ping keepalive endpoint
        run: |
          # -f: non-zero exit on HTTP 4xx/5xx so a failed ping shows in the log.
          # -s -S: silent, but still print errors. --max-time: never hang.
          curl -fsS --max-time 30 "$APP_URL/api/keepalive"
          echo "Keepalive OK"